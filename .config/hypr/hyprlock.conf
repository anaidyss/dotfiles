# локскрин в лесной палитре: янтарь #e8c987 на часах,
# зелёный #d87756 на вводе, терракота #e5534b на ошибках.
# отступы кратны 96px, фон — скриншот (снимает lock.sh)

general {
    text_trim = true
    hide_cursor = true
    ignore_empty_input = false
    immediate_render = true
    fail_timeout = 2000
}

bezier = forest, 0.22, 1.0, 0.36, 1.0
animation = fadeIn, 1, 5, forest
animation = inputFieldFade, 1, 5, forest
animation = inputFieldDots, 1, 7, forest
animation = inputFieldColors, 1, 8, forest

# фон — скриншот экрана, снимает lock.sh
background {
    monitor =
    path = /tmp/screen_lock.png
    color = rgb(1e1f1c)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8917
    brightness = 0.70
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

shape {
    size = 3000, 2000
    color = rgba(30, 31, 28, 0.30)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# слева сверху — часы и дата

label {
    monitor =
    text = <b>$TIME</b>
    color = rgb(e8c987)
    font_size = 150
    font_family = JetBrainsMono Nerd Font
    position = 96, -96
    halign = left
    valign = top
    zindex = 3
}

label {
    monitor =
    text = cmd[update:30000] date +'%A, %d %B'
    color = rgb(9a9a98)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 96, -316
    halign = left
    valign = top
    zindex = 3
}

# слева снизу — аватар и ввод пароля

image {
    monitor =
    path = /home/anaidyss/Pictures/avatar.jpg
    size = 96
    rounding = 0
    border_size = 2
    border_color = rgba(216, 119, 86, 0.40)
    position = 96, 240
    halign = left
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = <b>$USER</b>
    color = rgb(d5d5d3)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 220, 277
    halign = left
    valign = bottom
    zindex = 3
}

input-field {
    monitor =
    size = 420, 64
    outline_thickness = 2
    rounding = 0
    dots_size = 0.24
    dots_spacing = 0.38
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(216, 119, 86, 0.25)
    check_color = rgb(78b4c0)
    fail_color = rgb(e5534b)
    capslock_color = rgb(e8c987)
    bothlock_color = rgb(e8c987)
    inner_color = rgba(30, 31, 28, 0.75)
    font_color = rgb(d87756)
    font_family = JetBrainsMono Nerd Font

    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <i>Введи пароль...</i>
    fail_text = <i>неверный пароль</i> ($ATTEMPTS)
    hide_input = false

    position = 96, 140
    halign = left
    valign = bottom
    zindex = 4
}

label {
    monitor =
    text = $LAYOUT[us,ru]
    color = rgb(73736f)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 98, 96
    halign = left
    valign = bottom
    zindex = 3
}

# справа — батарея, погода, музыка

label {
    monitor =
    text = cmd[update:30000] /home/anaidyss/.local/bin/lock-battery.sh
    color = rgb(d87756)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -96, -96
    halign = right
    valign = top
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1800000] curl -s --max-time 5 'https://wttr.in/?format=1' || curl -s --max-time 5 'http://wttr.in/?format=1' || echo '<span foreground="#e5534b">weather n/a</span>'
    color = rgb(9a9a98)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -96, -150
    halign = right
    valign = top
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] /home/anaidyss/.local/bin/lock-music.sh
    color = rgb(9a9a98)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -96, 96
    halign = right
    valign = bottom
    zindex = 3
}
