# System palettes. Each role: [forest, graphite].
# Only the right column (graphite) should be edited, and new roles can be added;
# colors must be unique within a theme (otherwise switching is not reversible).
# After editing:  theme audit  (coverage check)  then  theme graphite  (apply).

themes = ["forest", "graphite"]

