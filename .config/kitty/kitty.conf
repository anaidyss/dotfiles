copy_on_select clipboard
mouse_map right press ungrabbed paste_from_clipboard


# BEGIN_KITTY_THEME
# Forest
include current-theme.conf
# END_KITTY_THEME
shell /usr/bin/fish

# nerd font, without it icons show up as squares
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# real flag emoji: Noto Emoji renders 🇳🇱 as the letters NL, so
# the regional indicators range goes to the Twemoji font (lives in ~/.local/share/fonts)
symbol_map U+1F1E6-U+1F1FF Twemoji

background_opacity 1.0

# no titlebar or window buttons — close with Mod+Q (niri)
hide_window_decorations titlebar-only
wayland_titlebar_color background

# ctrl+shift+g — highlight all IPs on screen, pick a number:
# overlay with country/flag/ISP/ASN/city/RTT (ipflag, offline GeoLite2 + online)
map ctrl+shift+g kitten hints --type ip --program "launch --type=overlay --title=IP /home/anaidyss/.local/bin/ipflag"
