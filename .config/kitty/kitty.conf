copy_on_select clipboard
mouse_map right press ungrabbed paste_from_clipboard


# BEGIN_KITTY_THEME
# Forest
include current-theme.conf
# END_KITTY_THEME
shell /usr/bin/fish

# nerd font, без него вместо иконок квадраты
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# настоящие флаги-эмодзи: Noto Emoji рисует 🇳🇱 как буквы NL, поэтому
# диапазон regional indicators отдаём шрифту Twemoji (лежит в ~/.local/share/fonts)
symbol_map U+1F1E6-U+1F1FF Twemoji

background_opacity 1.0

# без шапки и кнопок окна — закрывать через Mod+Q (niri)
hide_window_decorations titlebar-only
wayland_titlebar_color background

# ctrl+shift+g — подсветить все IP на экране, выбрать номер:
# overlay со страной/флагом/ISP/ASN/городом/RTT (ipflag, offline GeoLite2 + онлайн)
map ctrl+shift+g kitten hints --type ip --program "launch --type=overlay --title=IP /home/anaidyss/.local/bin/ipflag"
